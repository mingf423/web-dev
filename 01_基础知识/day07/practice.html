<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>用户列表页 —— 练习（第1周综合）Day07</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: #f1f2f6;
            padding: 40px;
            color: #303133;
        }

        h2 {
            margin-bottom: 16px;
            font-size: 18px;
            border-left: 4px solid #1b65b9;
            padding-left: 10px;
        }

        .container {
            background: #fff;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            max-width: 760px;
        }

        /* 搜索区 */
        .search-box {
            margin-bottom: 16px;
        }
        .search-box input {
            padding: 8px 10px;
            border: 1px solid #cecece;
            border-radius: 2px;
            font-size: 14px;
            width: 220px;
            color: #303133;
        }
        .search-box input:focus { border-color: #1b65b9; outline: none; }

        .btn {
            padding: 7px 15px;
            border: none;
            border-radius: 2px;
            font-size: 13px;
            cursor: pointer;
            background: #1b65b9;
            color: #fff;
            margin-left: 8px;
        }
        .btn:hover { background: #4581c6; }
        .btn.ghost {
            background: #fff;
            border: 1px solid #cecece;
            color: #606266;
        }
        .btn.ghost:hover { border-color: #1b65b9; color: #1b65b9; }
        .btn.danger { background: #f56c6c; }
        .btn.danger:hover { background: #f78989; }

        /* 表格 */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #dcdfe6;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #f0f2f5;
            font-weight: 700;
            color: #303133;
        }
        tr:hover td { background: #dee9f5; }

        .empty {
            text-align: center;
            color: #909399;
            padding: 24px;
        }

        .total {
            margin-top: 12px;
            font-size: 13px;
            color: #606266;
        }
        .total b { color: #1b65b9; }
    </style>
</head>
<body>

    <h2>用户列表页（练习）</h2>
    <div class="container" id="app">

        <!-- ① 查询表单：输入框 v-model 绑 keyword，按钮 @click 绑 search / reset -->
        <div class="search-box">
            <input v-model="keyword" placeholder="输入姓名搜索" @keyup.enter="search" />
            <button class="btn" @click="search">查询</button>
            <button class="btn ghost" @click="reset">重置</button>
        </div>

        <!-- ② 表格：v-for 渲染 filteredUsers，删除 @click 绑 remove -->
        <table>
            <thead>
                <tr><th>姓名</th><th>年龄</th><th>邮箱</th><th>操作</th></tr>
            </thead>
            <tbody>
                <tr v-for="u in filteredUsers" :key="u.id">
                    <td>{{ u.name }}</td>
                    <td>{{ u.age }}</td>
                    <td>{{ u.email }}</td>
                    <td><button class="btn danger" @click="remove(u.id)">删除</button></td>
                </tr>
                <tr v-if="filteredUsers.length === 0">
                    <td colspan="4" class="empty">没有匹配的用户</td>
                </tr>
            </tbody>
        </table>

        <!-- ③ 总人数 -->
        <div class="total">共 <b>{{ filteredUsers.length }}</b> 人</div>

    </div>
